name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Types
        run: mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in pyproject, the current release, and everything
        # between: the suite must pass on every version the package claims.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests
        # The suite runs on generated data and never touches the 42 MB dataset,
        # so CI needs no download and stays offline.
        run: pytest --cov --cov-fail-under=97

  security:
    name: Dependency and code scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Known vulnerabilities in dependencies
        run: pip-audit --skip-editable
      - name: Static analysis
        run: bandit -c pyproject.toml -r src -q

  notebook:
    name: Notebook stays runnable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,notebook]"
      - name: Check the notebook still imports what the package exposes
        # The notebook needs the dataset to execute, which CI does not have, so
        # what is checked here is that every name it uses still exists. A
        # notebook calling a function that was renamed is a broken deliverable.
        run: python scripts/check_notebook_api.py
